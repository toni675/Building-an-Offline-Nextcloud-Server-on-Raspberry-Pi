<VirtualHost *:80>
    ServerName nextcloud.local
    Redirect permanent / https://nextcloud.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName nextcloud.local
    DocumentRoot /srv/nextcloud-app/app

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/nextcloud.local.crt
    SSLCertificateKeyFile /etc/ssl/private/nextcloud.local.key

    <Directory /srv/nextcloud-app/app>
        Require all granted
        AllowOverride All
        Options FollowSymlinks MultiViews

        <IfModule mod_dav.c>
            Dav off
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nextcloud-error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud-access.log combined
</VirtualHost>
